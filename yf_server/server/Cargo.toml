[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
migration = { path = "../migration" }

axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "query"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
base64 = "0.22"
embedded-graphics = "0.8.2"
png = "0.18"
argon2 = "0.5"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"
rand = "0.8"
time = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
toml = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
urlencoding = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.32"
