# 可提交的安全配置模板。本机密钥请放入已忽略的 config.local.toml，生产优先使用环境变量。
[server]
addr = "127.0.0.1:8080"
trust_loopback_proxy = false

[database]
url = ""
auto_migrate = false

[storage]
root = "D:/yf_storage"

[jwt]
secret = ""
access_ttl_minutes = 120
refresh_ttl_days = 14
cookie_secure = true

[upload]
max_file_size = 2147483648
chunk_size = 10485760

[smtp]
host = ""
port = 465
username = ""
password = ""
from = ""

[web]
base_url = "https://replace-with-production-host"
