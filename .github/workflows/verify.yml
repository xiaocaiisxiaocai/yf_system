name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  non-browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      YF_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ignored
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: server_dotnet/global.json
          cache: true
          cache-dependency-path: server_dotnet/**/packages.lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install HTTP test dependency
        run: python -m pip install pymysql==1.1.2
      - name: Run full non-browser verification
        shell: pwsh
        run: ./server_dotnet/scripts/verify-all.ps1
      - name: Scan .NET dependencies
        # `dotnet list package --vulnerable` exits 0 even when it reports vulnerabilities,
        # so fail explicitly on its report marker (and on any command failure).
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for project in server_dotnet/Yf.Api/Yf.Api.csproj; do
            output="$(dotnet list "$project" package --vulnerable --include-transitive 2>&1)"
            echo "$output"
            if grep -q "has the following vulnerable packages" <<<"$output"; then
              echo "::error file=$project::Vulnerable NuGet packages reported for $project"
              status=1
            fi
          done
          exit "$status"
      - name: Audit web and build dependencies
        working-directory: web
        run: npm audit --include=dev
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-all-report
          path: .artifacts/tests/verify-all/
          if-no-files-found: ignore

  deploy-security:
    # Deployment/maintenance scripts target IIS on Windows PowerShell 5.1 (ACLs, Protect-YfDirectory),
    # so this self-test cannot run on the Linux job. It needs no database, IIS or MySQL client.
    # The full maintenance suite (test-maintenance.py / verify-all -IncludeMaintenance) is not run in CI:
    # it needs mysql.exe/mysqldump.exe plus a MySQL server, and Windows runners cannot host the
    # MySQL service container used by the Linux job.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run deployment security self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./server_dotnet/scripts/test-deploy-security.ps1
      - name: Upload deployment security scratch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-security-scratch
          path: .artifacts/tests/tmp/
          if-no-files-found: ignore
