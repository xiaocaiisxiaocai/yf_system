name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  non-browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      YF_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ignored
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server_dotnet/global.json
          cache: true
          cache-dependency-path: server_dotnet/**/packages.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP test dependency
        run: python -m pip install pymysql==1.1.2
      - name: Run full non-browser verification
        shell: pwsh
        run: ./server_dotnet/scripts/verify-all.ps1
      - name: Scan .NET dependencies
        run: dotnet list server_dotnet/Yf.Api/Yf.Api.csproj package --vulnerable --include-transitive
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-report
          path: .artifacts/tests/verify-all/
          if-no-files-found: ignore
